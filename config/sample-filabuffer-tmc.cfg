# Optional TMC2209 UART for filabuffer feeders (PWM on real STEP pins).
# See docs/FilaBuffer_TMC_PWM.md
#
# Usage:
#   1. Assign each placeholder step_pin/dir_pin/enable_pin to UNUSED GPIOs on your board.
#   2. Set uart_pin / uart_address to match each TMC2209.
#   3. Uncomment sections below and add to printer.cfg:
#        [include sample-filabuffer-tmc.cfg]
#   4. Call FILA_TMC_INIT after Klipper ready (or in START_PRINT).
#
# microsteps here MUST match filabuffer microstep (e.g. 16).

######################################################################
# buffer0 unit0 / unit1 — placeholder steppers for TMC only
######################################################################

#[stepper fila_b0_unit0_tmc]
#step_pin: PA4
#dir_pin: PA5
#enable_pin: !PA6
#microsteps: 16
#rotation_distance: 31.4
#
#[tmc2209 fila_b0_unit0_tmc]
#uart_pin: PC10
#uart_address: 0
#run_current: 0.5
#stealthchop_threshold: 999999
#
#[stepper fila_b0_unit1_tmc]
#step_pin: PA7
#dir_pin: PA8
#enable_pin: !PA9
#microsteps: 16
#rotation_distance: 31.4
#
#[tmc2209 fila_b0_unit1_tmc]
#uart_pin: PC11
#uart_address: 0
#run_current: 0.5
#stealthchop_threshold: 999999

######################################################################
# buffer1 unit0 / unit1
######################################################################

#[stepper fila_b1_unit0_tmc]
#step_pin: PB4
#dir_pin: PB5
#enable_pin: !PB6
#microsteps: 16
#rotation_distance: 31.4
#
#[tmc2209 fila_b1_unit0_tmc]
#uart_pin: PC12
#uart_address: 0
#run_current: 0.5
#stealthchop_threshold: 999999
#
#[stepper fila_b1_unit1_tmc]
#step_pin: PB7
#dir_pin: PB8
#enable_pin: !PB9
#microsteps: 16
#rotation_distance: 31.4
#
#[tmc2209 fila_b1_unit1_tmc]
#uart_pin: PC13
#uart_address: 0
#run_current: 0.5
#stealthchop_threshold: 999999

######################################################################
# Init TMC registers (uncomment with sections above)
######################################################################

