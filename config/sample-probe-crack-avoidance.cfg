# This file provides example config for the probe crack/obstacle
# avoidance feature. When the bed has cracks or obstacles at certain
# X or Y positions, the probe will automatically shift away from
# those lines and use the shifted position's Z result.
#
# This file is just a "snippet" - it must be added to a config file
# containing the rest of the printer configuration.
#
# See docs/Config_Reference.md for a description of parameters.

# Example: Bed has a crack along X=150 (vertical line) and another
# along Y=100 (horizontal line). The bed size is 300x300mm.
#
#   Y
#   300 +---------------------------+
#       |                           |
#       |                           |
#       |           |               |
#   100 |- - - - - -|- - - - - - - -|  <-- crack at Y=100
#       |           |               |
#       |           |               |
#     0 +---------------------------+ X
#       0          150             300
#                   ^
#                   crack at X=150
#
# When a probe point falls within 5mm of these lines, it shifts to
# 5mm away from the crack, staying on the same side:
#
#   Point at (153, 80) -> shifts to (155, 80)   [X: same side, +5]
#   Point at (147, 80) -> shifts to (145, 80)   [X: same side, -5]
#   Point at (120, 98) -> shifts to (120, 95)   [Y: same side, -5]
#   Point at (160, 80) -> no shift              [>5mm from crack]

[probe]
pin: PB1
x_offset: 25
y_offset: -10
z_offset: 0
speed: 5.0
samples: 2
#   Crack avoidance settings:
#   X positions of crack lines on the bed (comma separated, optional)
avoid_crack_x: 150.0
#   Y positions of crack lines on the bed (comma separated, optional)
avoid_crack_y: 100.0
#   Tolerance in mm. Points within this distance of a crack line will
#   be shifted. The shifted position is exactly this distance from the
#   crack, on the same side as the original point. Default is 5.0.
avoid_crack_tolerance: 5.0

# Example bed_mesh using the crack avoidance above.
# The mesh grid may have points landing on X=150 or Y=100.
# Those points will be automatically shifted before probing.
[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 10, 10
mesh_max: 280, 280
probe_count: 7, 7
algorithm: bicubic
