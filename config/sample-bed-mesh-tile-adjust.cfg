# This file provides example config for measuring and adjusting a bed
# made from multiple smaller bed plates.
#
# This file is just a "snippet" - it must be added to a config file
# containing the rest of the printer configuration.
#
# The example below divides one large rectangular bed into 2 columns and
# 3 rows of smaller plates.  BED_MESH_TILE_ADJUST will probe the four
# inset corner points of each plate, then report how each corner screw
# should be adjusted.

[bed_mesh]
mesh_min: -20, 10
mesh_max: 900, 600
probe_count: 5, 5

# Tiled bed adjustment settings.
tile_count: 2, 3
tile_mesh_min: -20, 10
tile_mesh_max: 900, 600
tile_screw_inset: 40
tile_reference: average
tile_screw_thread: CW-M4
tile_max_deviation: 0.2
