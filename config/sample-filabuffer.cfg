# Sample: two filament buffers, two feed units each, one section per buffer.
# [include sample-filabuffer.cfg]
#
# All feed units are defined inside [filabuffer <name>] using _0, _1, _2 suffix.
# Shared mechanics for every unit in a buffer (set once on unit 0):
#   microstep, full_steps_per_rotation, rotate_distance, gear_ratio, max_speed
# Unit 1+ inherit these from unit 0 unless overridden (e.g. gear_ratio_1).
#
# G-code:
#   FILA_BUFFER_SELECT BUFFER=buffer0 UNIT=unit0
#   FILA_BUFFER_START BUFFER=buffer0 MODE=work

######################################################################
# Buffer 0
######################################################################

[filabuffer buffer0]
jam_pin: ^PA0
low_pin: ^PA1
full_pin: ^PA2
pinout_delay: 0.025
full_stop_mode: hardware_enable
min_buffer_travel_mm: 6.0
feed_speed: 60.0
feed_speed_init: 60.0
pause_on_error: True
jam_gcode:
    M118 buffer0 JAM
low_timeout_gcode:
    M118 buffer0 feed timeout
break_gcode:
    M118 buffer0 break
runout_gcode:
    M118 buffer0 runout

# Shared feed mechanics (used by unit0; unit1 inherits unless *_1 set)
microstep: 16
full_steps_per_rotation: 200
rotate_distance: 31.4
gear_ratio: 5:1
max_speed: 100.0

# Feed unit 0
unit_name_0: unit0
inlet_pin_0: ^PB0
buffer_pin_0: ^PB1
step_pin_0: PB10
#dir_pin_0: PB11
#enable_pin_0: !PB12

# Feed unit 1 (inherits microstep/rotate_distance/gear_ratio from unit 0)
unit_name_1: unit1
inlet_pin_1: ^PB2
buffer_pin_1: ^PB3
step_pin_1: PB13
#dir_pin_1: PB14
#enable_pin_1: !PB15

######################################################################
# Buffer 1
######################################################################

[filabuffer buffer1]
jam_pin: ^PC0
low_pin: ^PC1
full_pin: ^PC2
pinout_delay: 0.025
full_stop_mode: hardware_enable
min_buffer_travel_mm: 6.0
feed_speed: 60.0
feed_speed_init: 60.0
pause_on_error: True
jam_gcode:
    M118 buffer1 JAM
low_timeout_gcode:
    M118 buffer1 feed timeout
break_gcode:
    M118 buffer1 break
runout_gcode:
    M118 buffer1 runout

microstep: 16
full_steps_per_rotation: 200
rotate_distance: 31.4
gear_ratio: 5:1
max_speed: 100.0

unit_name_0: unit0
inlet_pin_0: ^PD0
buffer_pin_0: ^PD1
step_pin_0: PD10

unit_name_1: unit1
inlet_pin_1: ^PD2
buffer_pin_1: ^PD3
step_pin_1: PD13

######################################################################
# Example macros
######################################################################

[gcode_macro FILA_BUFFER0_SETUP]
gcode:
    FILA_BUFFER_SELECT BUFFER=buffer0 UNIT=unit0
    FILA_BUFFER_INIT_FILAMENT BUFFER=buffer0 UNIT=unit0

[gcode_macro FILA_BUFFER1_SETUP]
gcode:
    FILA_BUFFER_SELECT BUFFER=buffer1 UNIT=unit0
    FILA_BUFFER_INIT_FILAMENT BUFFER=buffer1 UNIT=unit0

[gcode_macro FILA_BUFFER_ALL_STOP]
gcode:
    FILA_BUFFER_STOP BUFFER=buffer0
    FILA_BUFFER_RESET BUFFER=buffer0
    FILA_BUFFER_STOP BUFFER=buffer1
    FILA_BUFFER_RESET BUFFER=buffer1
