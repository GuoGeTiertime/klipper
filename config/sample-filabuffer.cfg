# Sample: two filament buffers, two feed units each.
# [include sample-filabuffer.cfg]
#
# buffer0: inlet/buffer via [filament_light_sensor] (ADC + LED per sensor)
# buffer1: inlet/buffer via [filament_switch_sensor] (GPIO switch_pin)
#
# Light sensor ADC calibration: define once in board config, e.g.:
#   [adc_light FILAMENT_SENSOR_10k]
#   voltage1: ...  resistance1: ...  lux1: ...
# (LED pins are set per sensor in [filament_light_sensor], not in adc_light.)
#
# G-code (BUFFER= selects instance):
#   FILA_BUFFER_SELECT BUFFER=buffer0 UNIT=unit0
#   FILA_BUFFER_START BUFFER=buffer0 MODE=work
#   FILA_BUFFER_STATUS BUFFER=buffer1

######################################################################
# buffer0 line sensors (filament_light_sensor -> filabuffer)
######################################################################

[filament_light_sensor b0_unit0_inlet]
sensor_type: FILAMENT_SENSOR_10k
sensor_pin: PC0
led_pin: PC1
lux_present: 12
lux_runout: 28
filabuffer: buffer0
filabuffer_unit: unit0
filabuffer_role: inlet
# sensor_enable 默认 False（有 filabuffer 链接时），由 filabuffer 接管

[filament_light_sensor b0_unit0_buffer]
sensor_type: FILAMENT_SENSOR_10k
sensor_pin: PC2
led_pin: PC3
lux_present: 12
lux_runout: 28
filabuffer: buffer0
filabuffer_unit: unit0
filabuffer_role: buffer

[filament_light_sensor b0_unit1_inlet]
sensor_type: FILAMENT_SENSOR_10k
sensor_pin: PC4
led_pin: PC5
lux_present: 12
lux_runout: 28
filabuffer: buffer0
filabuffer_unit: unit1
filabuffer_role: inlet

[filament_light_sensor b0_unit1_buffer]
sensor_type: FILAMENT_SENSOR_10k
sensor_pin: PC6
led_pin: PC7
lux_present: 12
lux_runout: 28
filabuffer: buffer0
filabuffer_unit: unit1
filabuffer_role: buffer

######################################################################
# buffer1 line sensors (filament_switch_sensor -> filabuffer)
######################################################################

[filament_switch_sensor b1_unit0_inlet]
switch_pin: ^PD0
filabuffer: buffer1
filabuffer_unit: unit0
filabuffer_role: inlet

[filament_switch_sensor b1_unit0_buffer]
switch_pin: ^PD1
filabuffer: buffer1
filabuffer_unit: unit0
filabuffer_role: buffer

[filament_switch_sensor b1_unit1_inlet]
switch_pin: ^PD2
filabuffer: buffer1
filabuffer_unit: unit1
filabuffer_role: inlet

[filament_switch_sensor b1_unit1_buffer]
switch_pin: ^PD3
filabuffer: buffer1
filabuffer_unit: unit1
filabuffer_role: buffer

######################################################################
# Buffer 0 (motors + jam/low/full only; line sense via light sensors above)
######################################################################

[filabuffer buffer0]
jam_pin: ^PA0
low_pin: ^PA1
full_pin: ^PA2
pinout_delay: 0.025
full_stop_mode: host
min_buffer_travel_mm: 6.0
feed_speed: 60.0
feed_speed_init: 60.0
pause_on_error: True
jam_gcode:
    M118 buffer0 JAM
low_timeout_gcode:
    M118 buffer0 feed timeout
break_gcode:
    M118 buffer0 break
runout_gcode:
    M118 buffer0 runout

microstep: 16
full_steps_per_rotation: 200
rotate_distance: 31.4
gear_ratio: 5:1
max_speed: 100.0

unit_name_0: unit0
step_pin_0: PB10
#dir_pin_0: PB11
#enable_pin_0: !PB12

unit_name_1: unit1
step_pin_1: PB13
#dir_pin_1: PB14
#enable_pin_1: !PB15

######################################################################
# Buffer 1 (motors + jam/low/full; line sense via switch sensors above)
######################################################################

[filabuffer buffer1]
jam_pin: ^PE0
low_pin: ^PE1
full_pin: ^PE2
pinout_delay: 0.025
full_stop_mode: hardware_enable
min_buffer_travel_mm: 6.0
feed_speed: 60.0
feed_speed_init: 60.0
pause_on_error: True
jam_gcode:
    M118 buffer1 JAM
low_timeout_gcode:
    M118 buffer1 feed timeout
break_gcode:
    M118 buffer1 break
runout_gcode:
    M118 buffer1 runout

microstep: 16
full_steps_per_rotation: 200
rotate_distance: 31.4
gear_ratio: 5:1
max_speed: 100.0

unit_name_0: unit0
step_pin_0: PD10

unit_name_1: unit1
step_pin_1: PD13

######################################################################
# Example macros
######################################################################

[gcode_macro FILA_BUFFER0_SETUP]
gcode:
    FILA_BUFFER_SELECT BUFFER=buffer0 UNIT=unit0
    FILA_BUFFER_INIT_FILAMENT BUFFER=buffer0 UNIT=unit0

[gcode_macro FILA_BUFFER1_SETUP]
gcode:
    FILA_BUFFER_SELECT BUFFER=buffer1 UNIT=unit0
    FILA_BUFFER_INIT_FILAMENT BUFFER=buffer1 UNIT=unit0

[gcode_macro FILA_BUFFER_ALL_STOP]
gcode:
    FILA_BUFFER_STOP BUFFER=buffer0
    FILA_BUFFER_RESET BUFFER=buffer0
    FILA_BUFFER_STOP BUFFER=buffer1
    FILA_BUFFER_RESET BUFFER=buffer1
