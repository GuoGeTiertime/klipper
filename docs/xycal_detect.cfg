# ========== Phase 1：Klipper 内嵌 XY Detect（[xycal_detect]）==========
# 合并进打印机 printer.cfg（或 [include xycal_detect.cfg]）后 FIRMWARE_RESTART。
#
# 前置：
#   1) 板端已部署本仓 klippy/xycal/ + extras/xycal_detect.py
#   2) 已安装: pip3 install opencv-python-headless numpy（或系统包）
#   3) 停掉旧的独立进程: pkill -f xycal_detect_server.py（避免抢 18765）
#   4) 保留既有 UI_MOVE / XYCAL_GOTO 宏（见 ScreenQML docs/xycal_printer_macros.cfg）
#
# 验收清单见同目录 docs/xycal_phase1_verify.md（ScreenQML 仓库）。

[xycal_detect]
# snapshot_url 仅作「请求未带 url」时的回退（Fluidd 裸发 XYCAL_DETECT 等）。
# ScreenQML / 正式 Detect：由 UI 当前预览摄像头在 POST /detect 的 body.url 传入
# （webcam / webcam2 / Moonraker webcams.list），不读本项覆盖 UI 选择。
snapshot_url: http://127.0.0.1/webcam/?action=snapshot
# 对 ScreenQML 暴露的 HTTP（契约同旧 xycal_detect_server）
listen_host: 127.0.0.1
listen_port: 18765
enable_http: True
min_confidence: 0.36
