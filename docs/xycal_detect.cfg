# ========== [已并入 xycal.cfg] 仅作分段样例 ==========
# 推荐 printer.cfg 只写一行：
#   [include xycal.cfg]
#
# 本文件保留给「只要 Detect、不要 calib/宏」的兼容场景。
# 内容须与 xycal.cfg 中 [xycal_detect] 段保持同步。
# 勿在 macros_all.cfg 或其他文件再写一节 [xycal_detect]。

[xycal_detect]
# 请求未带 url 时的回退（Fluidd 裸发 XYCAL_DETECT）
snapshot_url: http://127.0.0.1/webcam2/?action=snapshot
# 屏端在另一台机器时必须 0.0.0.0
listen_host: 0.0.0.0
listen_port: 18765
enable_http: True
min_confidence: 0.36
