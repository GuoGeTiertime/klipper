# ========== Phase 1/2：Klipper 内嵌 XY Detect（唯一 [xycal_detect]）==========
# printer.cfg 使用：[include xycal_detect.cfg]
# 勿在 macros_all.cfg 或其他文件再写一节 [xycal_detect]。
#
# ScreenQML 量产：detect_backend=klipper；回退 python 时用本 HTTP :18765
# 验收：ScreenQML docs/xycal_phase1_verify.md / xycal_phase2_verify.md

[xycal_detect]
# 请求未带 url 时的回退（Fluidd 裸发 XYCAL_DETECT）
snapshot_url: http://127.0.0.1/webcam2/?action=snapshot
# 屏端在另一台机器时必须 0.0.0.0
listen_host: 0.0.0.0
listen_port: 18765
enable_http: True
min_confidence: 0.36
