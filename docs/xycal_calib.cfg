# ========== Phase 3 step3：Host Center（可选，与 xycal_detect 同机）==========
# printer.cfg 增加：
#   [include xycal_detect.cfg]
#   [include xycal_calib.cfg]
#
# 验收：Fluidd 发 XYCAL_CENTER（喷头已在画面内、已 home）

[xycal_calib]
probe_mm: 0.5
tol_px: 0.5
max_iter: 12
min_move_px: 2.5
jog_speed: 30
min_confidence: 0.35
# 空则用 [xycal_detect] 的 snapshot_url
# snapshot_url: http://127.0.0.1/webcam2/?action=snapshot
