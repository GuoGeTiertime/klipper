# ========== Host Center + FitY + Z + ΔcxZ + Auto（与 xycal_detect 同机）==========
# printer.cfg 增加：
#   [include xycal_detect.cfg]
#   [include xycal_calib.cfg]
#
# Fluidd：
#   XYCAL_CENTER / XYCAL_FITY / XYCAL_Z / XYCAL_DCXZ / XYCAL_AUTO
#   XYCAL_CANCEL / XYCAL_CALIB_STATUS

[xycal_calib]
probe_mm: 0.5
tol_px: 0.5
max_iter: 12
min_move_px: 2.5
jog_speed: 30
min_confidence: 0.35
span_mm: 4.5
resid_floor_px: 8
resid_sigma_k: 2.5
# 空则用 [xycal_detect] 的 snapshot_url
# snapshot_url: http://127.0.0.1/webcam2/?action=snapshot

# ---- Z gap (XYCAL_Z) ----
zgap_axis: Y
zgap_shift_mm: 5
zgap_z_plus_mm: 5
zgap_z_step_mm: 0.05
zgap_match_tol_px: 1
zgap_dr_tol_px: 2
zgap_max_iter: 120

# ---- ΔcxZ (XYCAL_DCXZ) ----
z_min_mm: 60
dcx_t1_fallback: 3.8
