########################################
# 传感器使用配置（使用上面定义的sensor_type）
########################################

# 丝材检测传感器：使用预定义类型（模拟光强传感器）
[filament_light_sensor led1]
sensor_type: FILAMENT_SENSOR_10k          # 使用预定义丝材检测传感器类型
sensor_pin: ADC1                           # 传感器管脚（独立管脚PA4）
sensor_enable: True                       # 传感器使能开关
adc_voltage: 3.3                          # ADC参考电压（0-3.3V）
voltage_offset: 0                         # 电压偏移（通常为0）
report_time: 0.25                          # 上报频率（10Hz）

led_pin: LED1                              # 光源LED管脚（PWM引脚）
led_power: 1.0                            # 光源LED初始功率（0.0-1.0，可通过宏命令调整）
led_cycle_time:0.00017                     # 设置PWM周期为0.00017秒（约5882Hz）
led_hardware_pwm:True                     # True硬件PWM使能，False软件PWM使能
led_invert:False                           # # 默认True=低电平有效（需要反转）

# ADC采样参数（可选，用于降噪）
# 注意：sample_count越大，降噪效果越好，但对快速变化的响应越慢
sample_time: 0.001                        # 每次采样间隔（秒），默认0.001秒，与led周期需要错开
sample_count: 16                           # 每次报告采样次数，默认8次（取平均值降噪）最大安全值16（避免uint16_t溢出）

# 丝材检测阈值配置（使用光强Lux判断）
# 电压范围：0.3V~3.3V（仅用于电压范围检查，不用于丝材判断）
voltage_min: 0.3                           # 电压最小值（V），低于此值报错
voltage_max: 3.0                           # 电压最大值（V），高于此值报错
filament_threshold: 60.0                   # 丝材检测中心阈值（Lux），光强低于此值判定为有丝材，高于此值判定为无丝材
filament_offset: 5.0                      # 滞回阈值（Lux），用于防止在阈值附近抖动

# 双EMA跳变检测配置
ema_fast_time: 1.0                        # 快EMA时间常数（秒），快速跟踪当前变化
ema_slow_time: 5.0                       # 慢EMA时间常数（秒），跟踪长期基线/均值
spike_threshold: 2.0                      # 跳变阈值（Lux），当快慢EMA差值超过此值时判定为突变
spike_hold_count: 2                       # 去抖计数，连续N次满足条件才触发（10Hz下，5=0.5秒）
spike_use_abs: True                       # 单边/双边检测，False=只检测正向跳变，True=检测任意方向跳变

# 断料处理配置
pause_on_runout: False
runout_gcode:
    PAUSE FLAG="Filament LIGHT failed"

