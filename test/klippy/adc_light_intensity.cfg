# main config fo UP400 second 120 machines at 24-10
# include segments:
# 1. mcu config
# 2. board config
# 3. component config, such as configfile, exclude-object, respond, force_move, virtual_sdcard
# 4. output_pin
# 5. stepper x, y, z, z1, z2
# 6. extruder
# 7. heaters and temperature sensors# This file contains common pin mappings for TT CETUS2 boards.
[include ../machine/boards/temperature.cfg]
[mcu]   # Main mcu to handle xyz
serial:/dev/serial/by-path/platform-5200000.ehci1-controller-usb-0:1.1:1.0-port0
restart_method: command

# [output_pin LED]
# pin: PB6                        #2023-6-5 -Thomas
# value: 1
# [duplicate_pin_override]
# # pins:PC15, PC14, B_CP, B_DIR, C_CP, C_DIR, B_CHECK, PE11, C_CHECK, PC6

[board_pins mcu]    # STM32F407VET6.V6  #2023-7-4 -Thomas
mcu: mcu
aliases:
   
    # Thermisors
    ADC1=PA0,      
    ADC2=PA1,      
    ADC3=PA2,      
    ADC4=PA3,      
    ADC5=PA4,      
    ADC6=PA5,      
    ADC7=PA6,      
    ADC8=PA7,      
    # Thermisors
    LED1=PB6,      
    LED2=PB7,      
    LED3=PB8,      
    LED4=PB9,      
    LED5=PB0,      
    LED6=PB1,      
    LED7=PA8,      
    LED8=PA11,      
    # SWD-ST Link
    SWDIO=PA13,
    SWCLK=PA14,

    # 3.3v Serial UART
    TX1=PA9,
    RX1=PA10,
    BOOT1=PB2,

    # CAN
    # USB_CAN_TX=PA12,
    # USB_CAN_RX=PA11,

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
#   TURN_OFF_HEATERS
  CANCEL_PRINT_BASE

